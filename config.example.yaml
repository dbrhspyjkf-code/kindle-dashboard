# ============================================================
# Kindle Dashboard 配置示例
# ============================================================
# 用法:复制本文件为 config.yaml,按需修改。
#   cp config.example.yaml config.yaml
#
# config.yaml 含你的密钥,已被 .gitignore 排除,只存本地、不上传。
# 大多数人用设置网页(:port/setup)填写更方便,不必手改本文件。
#
# 「配置即页面」:填了某模块的关键字段,对应页面才显示;没填自动隐藏。
# 字段定义的唯一真相源:server/config/schema.py
# ============================================================

server:
  language: zh              # 界面/看板语言:zh 中文 / en English(en 隐藏农历节气生肖等中国元素)
  port: 8585
  timezone: Asia/Shanghai
  page_interval: 20          # Kindle 每隔几秒翻页
  kindle_model: base         # Kindle 机型:base/pw34/pw5/pw12/scribe/custom(按机型出原生分辨率不糊)
  render_width: 800          # 仅 kindle_model=custom 时手填(横屏分辨率=竖屏宽高对调)
  render_height: 600
  render_rotate: 270         # 渲染后旋转成竖屏写墨水屏(270=顺时针默认;90=逆时针;0=不转)
  render_grayscale: true
  render_interval: 30        # 多久重渲染一次看板图(秒;刷新时钟与已变数据,与采集解耦)
  app_poll_interval: 5       # 安卓 App 活 HTML 每隔几秒拉一次最新页面(触控版;与 Kindle 出图无关)
  access_token: ""           # 设置页访问令牌;安装/首次启动自动生成(留空=不鉴权,不推荐)

# 天气(和风天气 QWeather)——填了 key+location 才出天气
# 推荐用设置网页:填好 host/key 保存后,直接搜城市名选择,自动匹配编码、自动填城市名。
weather:
  provider: qweather
  host: ""                   # QWeather 控制台分配的专属域名 xxx.re.qweatherapi.com
  key: ""                    # API Key(密钥)
  location: "101010100"      # 城市 LocationID(北京示例);用设置网页搜城市自动填
  location_name: ""          # 城市显示名(看板天气标题用);设置网页选城市时自动写入,留空会自动反查
  interval: 600              # 采集间隔(秒);天气变化慢,建议 ≥600(也省 API 限额)

# 提醒事项(苹果)——需一台 Mac 跑采集脚本推送,见安装文档
reminders:
  enabled: false
  interval: 300              # 上报间隔(秒);launchd 定时器,改后需重跑 enable_reminders.sh

# Microsoft To Do(可选)——设置网页点【连接】登录微软账号即可,与苹果提醒合并显示
mstodo:
  enabled: false             # 由登录端点写入,勿手改
  client_id: "14d82eec-204b-4c2f-b7e8-296a70dab67e"   # 内置公开客户端;有自有 Azure 应用可换
  include_flagged_emails: false   # 是否包含 Outlook「标记的邮件」列表
  interval: 600              # 采集间隔(秒);待办变化慢,建议 ≥600

# AI 用量(Claude / Codex)——本机直接读 ccusage,无中间服务
# 安装时选「启用 AI 用量」会自动检测/安装 Node + ccusage 并把 enabled 置 true
ai_usage:
  enabled: false
  quota_show: both           # 额度面板:both=都显示 / claude=只Claude / codex=只Codex / none=都不显示(仅Token/花费,中转站用户);纯显示不影响采集
  claude_rate: 1.0           # Claude 官方价 × 倍率 = 自定义花费,默认 1.0
  codex_rate: 1.0            # Codex 官方价 × 倍率,默认 1.0;两档都为 1 时不显示自定义价
  interval: 300              # 本机 ccusage 采集间隔(秒);解析日志约 10s,建议 ≥300
  codex_quota_interval: 600  # Codex 额度上报(秒);launchd 定时器,改后重跑 enable_quota.sh
  claude_quota_interval: 300 # Claude 额度上报节流(秒);statusLine 推送
  codex_proxy: ""            # Codex 额度采集代理,如 http://127.0.0.1:7897;留空=直连

# Home Assistant ——填了地址+令牌,打印机等设备页才能拉数据
home_assistant:
  url: ""                    # http://192.168.x.x:8123
  token: ""                  # 长期访问令牌(密钥)
  interval: 60               # 采集间隔(秒);拉 HA 实体状态(打印机/设备页共用)

# 3D 打印机(经 HA 拉取,需先配好上面的 HA)
printer:
  enabled: false
  entity_prefix: ""          # 设置页可自动扫描选择;也可手填,如 a1_03919c451100824

# 资讯(RSS)——默认预置 AIHOT(AI 行业每日精选),装好就多一页;清空 feeds 即关闭
# 自适应填充一屏;无需账号/密钥。想加源:往 feeds 里再加 {url, name}
# 轮换跟看板翻页节奏走:每轮到资讯页换一批新的、停留期间不变(无独立计时)
news:
  feeds:
    - url: "https://aihot.virxact.com/feed.xml"
      name: "AIHOT"
  rotate: random             # 轮播方式:random 随机 / time 按时间(新→旧)
  interval: 1800             # 多久从 RSS 拉一次(秒);资讯变化慢,建议 ≥1800

# 下载器(qBittorrent / Transmission,可多台)——填了至少一个才出「下载」页
# 所有种子合并显示;账号密码只存本地。手填示例(去掉注释填进 clients):
downloaders:
  clients: []
  #   - name: 群晖 qB
  #     type: qbittorrent     # qbittorrent / transmission
  #     host: 192.168.x.x
  #     port: 8080            # qB 默认 8080;Transmission 默认 9091
  #     username: admin
  #     password: ""          # 只存本地
  rows: 8                     # 种子列表最多显示几条(活跃优先;全局统计仍含全部)
  interval: 15               # 采集间隔(秒);下载变化快,建议 10~30

# 音乐(Apple Music / Music.app)——显示 Mac 当前播放;由 Mac 上的 Music agent 推送
# 启用后即使没在放歌也会显示空状态页。采集 agent 为后续独立任务,此处仅控制是否启用页面
music:
  enabled: false
  interval: 5                # Mac Music agent 上报间隔(秒);建议 2~5
  pause_idle_after: 300      # 暂停超过多久进入专辑封面墙;0=关闭
  artwork_cache_limit: 120   # 服务端最多缓存多少张历史专辑封面
  artwork_wall_count: 20     # 封面墙最多抽取多少张缓存封面

# 智能家居实体墙(经 Home Assistant)——选了实体才出这一页
# 推荐用设置网页搜实体添加;手填示例(去掉注释填进 entities):
ha_page:
  entities: []
  #   - entity_id: light.living_room
  #     name: 客厅灯        # 留空用 HA 友好名
  #     icon: ""            # 留空用 HA 自带图标

# 设备监控 ——被监控机 Windows/Linux/Mac 均可。本机直读(local);远程每台用 push(装 agent 上报)
# platform: auto/linux/macos/windows —— 采集脚本按它分;local/push 均可自检
devices:
  machines: []
  interval: 30               # 服务端采集间隔(秒;本机直读)。push 设备的上报间隔由目标机 agent 自己定
  offline_after: 180         # push 设备超过这么久没上报就判离线、从看板撤下(目标机关机/断网自动消失)。本机直读不受影响
  # 示例(去掉注释填进 machines):
  #   - name: 这台Mac
  #     mode: local           # 本机直读,既不装 agent 也不交密码
  #     platform: auto
  #   - name: NAS
  #     mode: push            # 目标机装 agent 上报,不交密码;Windows 友好
  #     platform: linux
  #     host: 192.168.x.x

# 页面与风格
display:
  pages: []                  # 留空=按已配数据源自动启用;或显式列 [home, ai, device]
  style_mode: fixed          # fixed=固定一套;daily_random=每日随机
  style: style_a
  style_rotation: [style_a]  # 每日随机时从这些里选
# 注:各数据源的采集间隔已分别放在各自配置段的 interval 字段(见上),不再集中于此。
