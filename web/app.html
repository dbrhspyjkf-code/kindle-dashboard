<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kindle Dashboard · App</title>
<style>
  /* 安卓 App 活 HTML 外壳:全屏看板(锁横屏铺满)+ 自动轮播 + 相册式滑动翻页 + 轮询/点击控件。
     无底部页签(看板要干净全屏);页面内容用现有 styles 模板(target=android)经 iframe 显示。 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font-family: 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; color: #eee; }
  #stagewrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; }
  #stage { width: 800px; height: 600px; transform-origin: center center; background: #fff; }
  #view { width: 800px; height: 600px; border: 0; display: block; background: #fff; }
  /* 重连/提示层 */
  #banner { position: fixed; top: 0; left: 0; right: 0; padding: 10px; text-align: center;
    font-size: 14px; background: #b54; color: #fff; transform: translateY(-100%); transition: transform .25s; z-index: 40; }
  #banner.show { transform: translateY(0); }
  #toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(20px);
    background: #000; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: opacity .2s, transform .2s; z-index: 50; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }
  /* 详情层 */
  #detail { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center;
    justify-content: center; z-index: 60; padding: 24px; }
  #detail.show { display: flex; }
  #detail .box { background: #fff; color: #111; border-radius: 16px; padding: 22px 24px; max-width: 420px;
    width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #detail h3 { margin: 0 0 12px; font-size: 19px; }
  #detail .rows { font-size: 15px; line-height: 1.9; }
  #detail .rows b { display: inline-block; min-width: 84px; color: #666; font-weight: 600; }
  #detail button { margin-top: 18px; width: 100%; border: 0; border-radius: 10px; padding: 12px;
    background: #111; color: #fff; font-size: 15px; }
  /* 控制面板:底部滑出 sheet(B 类可控实体单击弹出)。控件照搬动作测试台,按 kind 渲染。 */
  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 62; }
  #panel.show { display: block; }
  #panel .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; color: #111;
    border-radius: 18px 18px 0 0; padding: 16px 18px max(18px, env(safe-area-inset-bottom)); max-height: 80%;
    overflow-y: auto; box-shadow: 0 -8px 40px rgba(0,0,0,.35);
    max-width: 560px; margin: 0 auto; transform: translateY(100%); transition: transform .25s; }
  #panel.show .sheet { transform: translateY(0); }
  #panel .sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  #panel .sh-head .ttl { font-size: 18px; font-weight: 700; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #panel .sh-head .x { flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: #eef0f3; color: #555; font-size: 16px; line-height: 34px; padding: 0; }
  #panel .pn-state { font-size: 13px; color: #888; margin: 2px 0 14px; }
  #panel .pn-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  #panel .pb { flex: 1 1 auto; min-width: 84px; border: 1.5px solid #d8dbe0; background: #fff; color: #1d2430;
    border-radius: 12px; padding: 13px 10px; font-size: 15px; font-weight: 600; }
  #panel .pb.fill { background: #1d2430; color: #fff; border-color: #1d2430; }
  #panel .pb.danger { border-color: #d64545; color: #d64545; }
  #panel .pb.sel { background: #1d2430; color: #fff; border-color: #1d2430; }
  #panel .pb:active { transform: scale(.96); }
  #panel .pn-row { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
  #panel .pn-row .big { font-size: 30px; font-weight: 800; flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
  #panel .pn-step { width: 56px; height: 56px; flex: none; border: 1.5px solid #d8dbe0; background: #fff;
    border-radius: 14px; font-size: 26px; font-weight: 700; color: #1d2430; }
  #panel .pn-sub { font-size: 12px; color: #999; }
  #panel input[type=range] { width: 100%; margin: 14px 0; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #d8dbe0;
    border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  #panel .pn-label { font-size: 12px; color: #999; margin: 12px 0 6px; font-weight: 600; }
  /* 浏览器版浮层控件:全屏 + 设置齿轮。默认隐藏,JS 仅在普通浏览器(无 window.KDAndroid)显示;
     App 壳里由原生全屏/常亮处理,不放这些(壁挂全屏看,免误触)。 */
  #webctl { position: fixed; right: 14px; bottom: 14px; z-index: 55; display: none; gap: 8px; }
  #webctl button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(0,0,0,.42);
    color: #fff; font-size: 20px; line-height: 44px; padding: 0; cursor: pointer; -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px); transition: opacity .3s; }
  #webctl button:active { transform: scale(.92); }
  #webctl.fs { opacity: .22; }            /* 进全屏后淡到角落、不挡看板;悬停恢复 */
  #webctl.fs:hover { opacity: 1; }
  /* 全屏兜底:进全屏的是 documentElement,确保铺满视口并裁掉任何溢出(防上下左右滚动条);
     画布缩放由 JS 的 fullscreenchange→fit 重算,这里是 CSS 保险。 */
  :fullscreen { width: 100%; height: 100%; overflow: hidden; }
  :-webkit-full-screen { width: 100%; height: 100%; overflow: hidden; }
  :fullscreen #stagewrap, :-webkit-full-screen #stagewrap { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="stagewrap"><div id="stage"><iframe id="view" referrerpolicy="no-referrer"></iframe></div></div>
<div id="toast"></div>
<div id="detail"><div class="box"><h3 id="dt-title"></h3><div class="rows" id="dt-rows"></div><button id="dt-close">关闭</button></div></div>
<div id="panel"><div class="sheet"><div class="sh-head"><span class="ttl" id="pn-title"></span><button class="x" id="pn-x">✕</button></div><div class="pn-state" id="pn-sub"></div><div id="pn-body"></div></div></div>
<div id="webctl"><button id="wc-fs" title="全屏 Fullscreen">⛶</button><button id="wc-set" title="设置 Setup">⚙</button></div>

<script>
"use strict";
// 服务端注入:{token, interval, style, default, pages:[{key,title}], texts:{...}}
var CFG = __APP_CONFIG__;
var T = CFG.texts || {};
var tok = CFG.token || "";
var cur = CFG.default || (CFG.pages[0] && CFG.pages[0].key) || "home";
var curDocKey = null, polling = null;

var view = document.getElementById("view");
var stage = document.getElementById("stage");
var banner = document.getElementById("banner");
var toastEl = document.getElementById("toast");
var detail = document.getElementById("detail");

function authHeaders(extra) {
  var h = extra || {};
  if (tok) h["X-Access-Token"] = tok;
  return h;
}
function withTok(url) { return tok ? (url + (url.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(tok)) : url; }

// ---- 画布固定 800×600(与 Kindle 一致):对整块画布等比缩放居中铺满,屏幕比例不符时四周用
//      看板背景色填充(见 loadPage 的 onload)。不按屏比重排内容 → 任意分辨率/比例都是同一套
//      验证过的布局,零溢出、零适配,一劳永逸。----
function fit() {
  var sx = window.innerWidth / 800, sy = window.innerHeight / 600;
  var s = Math.min(sx, sy);                       // 等比基准:高度方向填满
  // 横向在等比基础上最多拉伸 STRETCH 倍去吃掉留白(画面略扁、内容布局不变);非 4:3 屏的留白与变形折中。
  // 1.2 = 实测 16:9 上留白(~5%/侧)和横向变形(20%)都可接受(用户拍板 2026-06-24);剩余留白由看板背景色填充。
  var STRETCH = 1.2;
  var sxc = Math.min(sx, s * STRETCH);            // 横向拉到「等比×1.2」或刚好填满,取小者
  stage.style.transform = "scaleX(" + sxc + ") scaleY(" + s + ")";   // stage/view 恒 800×600,只缩放
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);

// ---- 重连横幅 / toast ----
var online = true;
function setOnline(ok) {
  if (ok === online) return;
  online = ok;
  if (ok) { banner.classList.remove("show"); }
  else { banner.textContent = T.reconnecting || "连接中断,重连中…"; banner.classList.add("show"); }
}
var toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
}

// ---- 拉单页(target=android 的活 HTML)----
function fetchPage(key) {
  // 画布固定 800,不再传 cw;kbatt/kchg=本机电量(原生经 KDAndroid 桥 → 页脚显示手机自己的电量)
  var path = "/app/page/" + key;
  try {
    if (window.KDAndroid && typeof KDAndroid.level === "function") {
      var lv = KDAndroid.level();
      if (lv >= 0) path += "?kbatt=" + lv + "&kchg=" + (KDAndroid.charging() ? 1 : 0);
    }
  } catch (e) {}
  return fetch(withTok(path), { headers: authHeaders(), cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
}
var loading = false;
function loadPage(key, full) {
  if (loading) return Promise.resolve();
  loading = true;
  return fetchPage(key).then(function (html) {
    if (full || curDocKey !== key) {
      // 切页:整文档换(各页 CSS 不同),换好后挂点击委托 + 滑动翻页监听
      view.onload = function () {
        try {
          var d = view.contentDocument;
          d.documentElement.style.overflow = "hidden";   // 看板=固定 800×600 画布,任何方向都不出滚动条
          if (d.body) {
            d.body.style.overflow = "hidden";
            // 缩放后四周的留白用看板自身背景色填满(白底→白、深色→深),视觉填满、不留黑边
            var bg = getComputedStyle(d.body).backgroundColor;
            if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent")
              document.getElementById("stagewrap").style.background = bg;
          }
          d.addEventListener("click", onClick);
          attachSwipe(d);
        } catch (e) {}
      };
      view.srcdoc = html;
      curDocKey = key;
    } else {
      // 同页轮询:只换 body,不重载(无闪烁;document 上的点击/滑动委托仍在)
      try {
        var doc = view.contentDocument;
        var nb = new DOMParser().parseFromString(html, "text/html").body;
        doc.body.innerHTML = nb.innerHTML;
        runBodyScripts(doc);   // innerHTML 不执行 <script>(如 news 自适应排版),手动重跑
      } catch (e) { view.srcdoc = html; }
    }
    setOnline(true);
  }).catch(function () { setOnline(false); }).then(function () { loading = false; });
}

// ---- 点击委托(iframe 文档内)----
function onClick(e) {
  scheduleRotate();   // 用户在操作当前页 → 重置自动翻页计时,别把正在操作的页翻走
  var el = e.target.closest && e.target.closest("[data-action]");
  if (el) { e.preventDefault(); return runAction(el); }
  var p = e.target.closest && e.target.closest("[data-panel]");
  if (p) { e.preventDefault(); return openPanel(p); }
  var d = e.target.closest && e.target.closest("[data-detail]");
  if (d) { e.preventDefault(); return showDetail(d); }
}
function runAction(el) {
  var a = el.getAttribute("data-action");
  var cmd = el.getAttribute("data-cmd") || "toggle";
  var url, body;
  if (a === "ha") { url = "/api/action/ha"; body = { entity_id: el.getAttribute("data-entity"), action: cmd }; }
  else if (a === "torrent") {
    url = "/api/action/torrent";
    body = { client: el.getAttribute("data-client"), id: el.getAttribute("data-id"), action: cmd };
  }
  else return;
  el.classList.add("acting");                      // 乐观反馈:立即按压态
  fetch(withTok(url), { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
    .then(function (j) { if (!j.ok) toast(j.error || (T.action_failed || "操作失败")); })
    .catch(function () { toast(T.net_error || "网络错误"); })
    .then(function () { el.classList.remove("acting"); loadPage(cur, false); });  // 成功后立即重拉确认
}

// ---- 详情层(纯前端,展示卡片更多字段)----
function showDetail(d) {
  document.getElementById("dt-title").textContent = d.getAttribute("data-detail-title") || d.getAttribute("data-detail") || "";
  var rows = "";
  var raw = d.getAttribute("data-detail-rows") || "";
  raw.split("|").forEach(function (pair) {
    if (!pair) return;
    var i = pair.indexOf(":");
    if (i < 0) { rows += "<div>" + esc(pair) + "</div>"; return; }
    rows += "<div><b>" + esc(pair.slice(0, i)) + "</b>" + esc(pair.slice(i + 1)) + "</div>";
  });
  document.getElementById("dt-rows").innerHTML = rows;
  detail.classList.add("show");
}
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
document.getElementById("dt-close").onclick = function () { detail.classList.remove("show"); scheduleRotate(); };
detail.onclick = function (e) { if (e.target === detail) { detail.classList.remove("show"); scheduleRotate(); } };

// ---- 控制面板(底部 sheet,B 类可控实体单击弹出)----
// 按 kind 渲染控件(照搬动作测试台样式),控件 onclick → POST /api/action/ha;成功后重拉当前页确认。
var panel = document.getElementById("panel");
var pnBody = document.getElementById("pn-body");
var PN = { entity: "", kind: "", name: "", meta: null, target: null };

function L(k) { return T[k] || k; }
function pb(act, label, cls, pv) {
  return '<button class="pb ' + (cls || "") + '" data-pa="' + act + '"'
    + (pv != null ? ' data-pv="' + esc(pv) + '"' : "") + '>' + esc(label) + "</button>";
}
function buildControls(kind, m) {
  m = m || {};
  if (kind === "cover") {
    var sub = (m.position != null) ? (L("p_position") + " " + m.position + "%") : "";
    return { sub: sub, body: '<div class="pn-grid">' + pb("on", L("p_open"), "fill") + pb("off", L("p_close")) + pb("stop", L("p_stop"), "danger") + "</div>" };
  }
  if (kind === "media") {
    var body = '<div class="pn-grid">' + pb("toggle", L("p_play"), "fill") + pb("prev", L("p_prev")) + pb("next", L("p_next")) + "</div>"
      + '<div class="pn-grid" style="margin-top:9px">' + pb("vol_down", L("p_voldown")) + pb("vol_up", L("p_volup")) + pb("mute", L("p_mute")) + "</div>";
    return { sub: m.title ? esc(m.title) : "", body: body };
  }
  if (kind === "select") {
    var opts = m.options || [];
    if (!opts.length) return { sub: "", body: '<div class="pn-sub">—</div>' };
    var body = '<div class="pn-grid">' + opts.map(function (o) {
      return '<button class="pb' + (o === m.current ? " sel" : "") + '" data-pa="select_option" data-pv="' + esc(o) + '">' + esc(o) + "</button>";
    }).join("") + "</div>";
    return { sub: "", body: body };
  }
  if (kind === "number") {
    var mn = (m.min != null ? m.min : 0), mx = (m.max != null ? m.max : 100),
        st = (m.step != null ? m.step : 1), v = (m.value != null ? m.value : mn);
    var u = m.unit ? (" " + esc(m.unit)) : "";
    var body = '<div class="pn-row"><span class="pn-sub">' + mn + '</span><span class="big" id="pn-numval">' + v + u + '</span><span class="pn-sub">' + mx + "</span></div>"
      + '<input type="range" id="pn-num" min="' + mn + '" max="' + mx + '" step="' + st + '" value="' + v + '">'
      + '<div class="pn-grid">' + pb("set_value", L("p_set"), "fill") + "</div>";
    return { sub: "", body: body };
  }
  if (kind === "climate") {
    PN.target = (m.target != null ? m.target : (m.current != null ? m.current : 24));
    var modes = m.modes || [];
    var sub = (m.current != null) ? (L("p_current") + " " + m.current + "°") : "";
    var body = '<div class="pn-grid">' + pb("on", L("p_on"), "fill") + pb("off", L("p_off")) + "</div>"
      + '<div class="pn-label">' + L("p_target") + "</div>"
      + '<div class="pn-row"><button class="pn-step" data-pa="set_temp" data-dir="-1">−</button>'
      + '<span class="big" id="pn-temp">' + PN.target + '°</span>'
      + '<button class="pn-step" data-pa="set_temp" data-dir="1">+</button></div>';
    if (modes.length) {
      body += '<div class="pn-label">' + L("p_mode") + '</div><div class="pn-grid">'
        + modes.map(function (md) { return '<button class="pb' + (md === m.mode ? " sel" : "") + '" data-pa="set_mode" data-pv="' + esc(md) + '">' + esc(md) + "</button>"; }).join("")
        + "</div>";
    }
    return { sub: sub, body: body };
  }
  if (kind === "alarm") {
    var body = '<input type="text" id="pn-code" placeholder="' + esc(L("p_code")) + '">'
      + '<div class="pn-grid">' + pb("arm_home", L("p_arm_home")) + pb("arm_away", L("p_arm_away")) + pb("arm_night", L("p_arm_night")) + "</div>"
      + '<div class="pn-grid" style="margin-top:9px">' + pb("disarm", L("p_disarm"), "danger") + "</div>";
    return { sub: "", body: body };
  }
  return { sub: "", body: '<div class="pn-sub">—</div>' };
}
function openPanel(el) {
  PN.entity = el.getAttribute("data-entity") || "";
  PN.kind = el.getAttribute("data-panel") || "";
  PN.name = el.getAttribute("data-name") || "";
  try { PN.meta = JSON.parse(el.getAttribute("data-meta") || "{}"); } catch (e) { PN.meta = {}; }
  document.getElementById("pn-title").textContent = PN.name;
  var r = buildControls(PN.kind, PN.meta);
  document.getElementById("pn-sub").textContent = r.sub || "";
  pnBody.innerHTML = r.body || "";
  panel.classList.add("show");
}
function panelAction(action, value, btn) {
  var body = { entity_id: PN.entity, action: action };
  if (value !== undefined && value !== null && value !== "") body.value = value;
  if (btn) btn.classList.add("acting");
  fetch(withTok("/api/action/ha"), { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body) })
    .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
    .then(function (j) { if (!j.ok) toast(j.error || (T.action_failed || "操作失败")); })
    .catch(function () { toast(T.net_error || "网络错误"); })
    .then(function () { if (btn) btn.classList.remove("acting"); loadPage(cur, false); });
}
pnBody.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-pa]");
  if (!b) return;
  var act = b.getAttribute("data-pa");
  if (act === "set_temp" && b.getAttribute("data-dir")) {       // 空调步进:本地累加目标温度再下发
    var dir = parseFloat(b.getAttribute("data-dir")) || 0;
    PN.target = Math.round((PN.target + dir) * 10) / 10;
    var tEl = document.getElementById("pn-temp"); if (tEl) tEl.textContent = PN.target + "°";
    return panelAction("set_temp", PN.target, b);
  }
  var val = b.getAttribute("data-pv");
  if (act === "set_value") { var sl = document.getElementById("pn-num"); if (sl) val = sl.value; }
  if (PN.kind === "alarm") { var code = document.getElementById("pn-code"); if (code && code.value) val = code.value; }
  if (act === "disarm" && !window.confirm(T.confirm_disarm || "确认撤防?")) return;
  if (act === "select_option" || act === "set_mode") {          // 选项即时高亮
    var sibs = b.parentNode.querySelectorAll(".pb");
    for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove("sel");
    b.classList.add("sel");
  }
  panelAction(act, val, b);
});
pnBody.addEventListener("input", function (e) {                 // 数值滑块实时显示
  if (e.target && e.target.id === "pn-num") {
    var d = document.getElementById("pn-numval");
    if (d) d.textContent = e.target.value + (PN.meta && PN.meta.unit ? (" " + PN.meta.unit) : "");
  }
});
document.getElementById("pn-x").onclick = function () { panel.classList.remove("show"); scheduleRotate(); };
panel.onclick = function (e) { if (e.target === panel) { panel.classList.remove("show"); scheduleRotate(); } };

// ---- innerHTML 不执行脚本:body 替换后手动重建 <script> 让其重跑(news 自适应排版靠它)----
function runBodyScripts(doc) {
  var olds = doc.body.querySelectorAll("script");
  for (var i = 0; i < olds.length; i++) {
    var o = olds[i], s = doc.createElement("script");
    if (o.src) s.src = o.src; else s.textContent = o.textContent;
    o.parentNode.replaceChild(s, o);
  }
}

// ---- 翻页:自动轮播(page_interval)+ 相册式左右滑手动翻 ----
var rotateTimer = null;
function curIndex() {
  for (var i = 0; i < CFG.pages.length; i++) if (CFG.pages[i].key === cur) return i;
  return 0;
}
function scheduleRotate() {
  clearTimeout(rotateTimer);
  if (CFG.pages.length <= 1) return;                       // 只有一页不轮播
  var ms = Math.max(5, CFG.page_interval || 20) * 1000;
  rotateTimer = setTimeout(function () { nextPage(); }, ms);
}
function gotoPage(key) {
  cur = key;
  loadPage(cur, true);     // 整页重载,各页 CSS + 自适应脚本重新生效
  scheduleRotate();        // 翻页后顺延下一次自动翻(手动滑也会重置计时,不抢)
}
function nextPage() {
  if (panel.classList.contains("show") || detail.classList.contains("show")) { scheduleRotate(); return; }  // 面板/详情开着=用户在操作,顺延不翻
  if (CFG.pages.length) gotoPage(CFG.pages[(curIndex() + 1) % CFG.pages.length].key);
}
function prevPage() { if (CFG.pages.length) gotoPage(CFG.pages[(curIndex() - 1 + CFG.pages.length) % CFG.pages.length].key); }

// 滑动检测挂在 iframe 文档上(内容在 iframe 里,触摸事件被它接收)。
// 横向滑动够距离且偏水平 → 翻页;轻点(位移小)不拦截,交给 onClick 处理动作按钮。
function swipeJudge(dx, dy, dt) {   // 横向够距离、够快、偏水平 → 翻页;轻点/竖滑不拦截
  if (dt < 700 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx < 0) nextPage(); else prevPage();
  }
}
function attachSwipe(doc) {
  var sx = 0, sy = 0, st = 0;
  doc.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  doc.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0];
    swipeJudge(t.clientX - sx, t.clientY - sy, Date.now() - st);
  }, { passive: true });
  // 桌面浏览器:鼠标不触发 touch 事件 → 补鼠标拖动翻页(同样的判断,轻点不拦截交给动作按钮)
  var md = false, mx = 0, my = 0, mt = 0;
  doc.addEventListener("mousedown", function (e) { md = true; mx = e.clientX; my = e.clientY; mt = Date.now(); });
  doc.addEventListener("mouseup", function (e) {
    if (!md) return; md = false;
    swipeJudge(e.clientX - mx, e.clientY - my, Date.now() - mt);
  });
  doc.addEventListener("keydown", onArrowKey);   // 焦点可能落 iframe 内,故 iframe 文档也挂一份键盘翻页
}
function onArrowKey(e) {
  if (e.key === "ArrowLeft") { e.preventDefault(); prevPage(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); nextPage(); }
}

// ---- 浏览器版控件:全屏按钮 + 设置齿轮 + 尽量保持常亮(诚实:HTTP 下 Wake Lock 多半拿不到)----
// 仅普通浏览器(电脑/平板/Kindle 自带浏览器)显示;App 壳内 window.KDAndroid 存在 → 原生已全屏常亮,不显示。
(function () {
  if (window.KDAndroid) return;                 // App 内:原生处理,网页控件不出现
  var ctl = document.getElementById("webctl");
  if (!ctl) return;
  ctl.style.display = "flex";
  var fsBtn = document.getElementById("wc-fs");
  var setBtn = document.getElementById("wc-set");
  var wakeLock = null;
  function requestWake() {                       // Screen Wake Lock 仅「安全上下文」(HTTPS/localhost)可用;HTTP 下静默失败,不报错
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen")
          .then(function (w) { wakeLock = w; w.addEventListener("release", function () { wakeLock = null; }); })
          .catch(function () {});
      }
    } catch (e) {}
  }
  function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enterFs() {
    var el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  }
  function exitFs() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) { try { fn.call(document); } catch (e) {} }
  }
  fsBtn.onclick = function () {                  // 全屏只能在用户手势里触发(浏览器安全限制),不能自动进
    if (isFs()) exitFs(); else { enterFs(); requestWake(); }
  };
  function syncFs() {
    ctl.classList.toggle("fs", !!isFs());
    fit();                  // 进/退全屏窗口尺寸变了 → 重算缩放铺满
    setTimeout(fit, 150);   // 部分浏览器全屏后尺寸稍迟才稳定,再算一次
  }
  document.addEventListener("fullscreenchange", syncFs);
  document.addEventListener("webkitfullscreenchange", syncFs);
  setBtn.onclick = function () { window.location.href = withTok("/setup"); };   // 设置齿轮:跳设置页,沿用当前令牌免重输
  document.addEventListener("visibilitychange", function () {                   // 切回前台时重申(后台会自动释放锁)
    if (document.visibilityState === "visible" && !wakeLock) requestWake();
  });
  requestWake();
})();

// ---- 启动 ----
fit();
document.addEventListener("keydown", onArrowKey);   // 顶层键盘 ← → 翻页(焦点在外层时;iframe 内由 attachSwipe 另挂)
if (CFG.pages.length) { loadPage(cur, true); scheduleRotate(); }
else { banner.textContent = T.no_pages || "还没启用任何页面,请先在设置页配置数据源。"; banner.classList.add("show"); }
// 当前页数据轮询(刷 HA 状态/下载进度等);翻页由 scheduleRotate 的独立计时器负责。
// news 页跳过轮询:资讯内容慢、且要求「停留期间不变,每轮到一次才换一批新的」——
// 轮到 news 时整页重载(gotoPage)取当前一批,停留期间不再刷新,避免中途跳条。
var NO_POLL = { news: 1 };
polling = setInterval(function () { if (!NO_POLL[cur]) loadPage(cur, false); }, Math.max(2, CFG.interval || 5) * 1000);

// 音乐页的歌一放完,iframe 内的页面会调这里 → 立刻拉一次、并在过渡期(最多 ~7s,覆盖 Mac 5s 上报窗口)
// 里每 1.5s 拉一次,尽快换到下一首;过渡期一过自动停,平时不增加负载。
var _mEndBurst = null, _mEndUntil = 0;
window.kdMusicEnded = function () {
  if (cur !== "music") return;
  _mEndUntil = Date.now() + 7000;          // 每次"歌结束"信号都把过渡窗口顺延
  loadPage("music", false);                // 立刻拉一次
  if (_mEndBurst) return;                   // 已在快拉中,不重复起
  _mEndBurst = setInterval(function () {
    if (cur !== "music" || Date.now() >= _mEndUntil) { clearInterval(_mEndBurst); _mEndBurst = null; return; }
    loadPage("music", false);
  }, 1500);
};
</script>
</body>
</html>
