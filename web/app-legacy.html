<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>墨水桌面看板 · Legacy</title>
<style>
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#ece8de;-webkit-text-size-adjust:none;}
body{font-family:Arial,'Droid Sans Fallback',sans-serif;}
/* 把整张高清图当作容器的【背景图】(background-size:contain 等比缩放居中),而不是贴一个 <img> 元素。
   ——这样「图 + 四周留白」是同一个图层、同一个暖白底色 #ece8de:① 没有独立 <img> 元素的边缘,
   彻底消除「图片和留白之间那两条竖线」(老 WebView 给 <img> 边缘留缝/缩放抗锯齿所致);
   ② 留白与图底绝对无缝。纯 CSS 缩放居中,不靠 4.2 测不准的 JS。-webkit-background-size 4.x WebKit 支持。 */
#wrap{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;background-color:#ece8de;
  background-repeat:no-repeat;background-position:center center;
  -webkit-background-size:contain;background-size:contain;}
#banner{position:absolute;left:0;right:0;top:0;background:#8b0000;color:#f5f1e8;text-align:center;
  padding:8px;font-size:13px;font-weight:700;display:none;z-index:10;}
#banner.show{display:block;}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="banner"></div>

<script>
/* Android 4.2 legacy mode: the WebView is only a color photo frame.
   All real layout is rendered server-side into /app-legacy/frame.png. */
"use strict";
var CFG = __APP_CONFIG__;
var T = CFG.texts || {};
var tok = CFG.token || "";
var wrap = document.getElementById("wrap");
var banner = document.getElementById("banner");
var online = true;

/* 缩放+居中全交给 CSS(#wrap 的 background-size:contain)。服务端出 1600×1200 高清图,
   pad 端 downscale 显示 → 锐利;不靠任何 JS 测视口(4.2 测不准)。 */
function withTok(url) {
  if (!tok) { return url; }
  return url + (url.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(tok);
}

function setOnline(ok) {
  if (ok === online) { return; }
  online = ok;
  if (ok) {
    banner.className = "";
  } else {
    banner.innerHTML = T.reconnecting || "连接中断,重连中...";
    banner.className = "show";
  }
}

function refresh() {
  var next = new Image();
  next.onload = function () {
    wrap.style.backgroundImage = "url('" + next.src + "')";   // 预加载完才换背景 → 不闪
    setOnline(true);
  };
  next.onerror = function () { setOnline(false); };
  next.src = withTok("/app-legacy/frame.png?t=" + (new Date().getTime()));
}
refresh();
setInterval(refresh, Math.max(3, CFG.interval || 5) * 1000);
</script>
</body>
</html>
