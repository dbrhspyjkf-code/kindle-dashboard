<title>墨水桌面看板 · Legacy</title>
<style>
/* ============================================================================
   老系统(安卓 4.x 古董 WebKit)降级活页外壳 —— 浅色 editorial(镜像默认主题 style_a)。
   ★布局原语(2026-06-24 第二次返工,改用 4.2 真机已验证的 panel-legacy 同款):
     - **撑满/分栏不靠 -webkit-box 老式 flexbox**(2012 AOSP WebKit 上不可靠:格子不等大、填不满,
       桌面 Chrome 却正常 → 误判过)。改用:**绝对定位定高骨架 + float + 显式百分比宽/高 + height:100%**。
     - 定高链根:.main 用绝对定位(top/bottom 算出定 px 高)。
     - 4.2 真机继续暴露出「float 百分比列 + table height:100%」会按内容最小宽度收缩,
       所以承重区域改为固定 CSS 像素坐标(面向 1280×800/213dpi:约 960 CSS px 宽)。
     - 网格:行/格显式 px 宽高 + float,不用百分比高度承重。
     - 柱图/底部锚定:position:absolute(% 高度相对定高父级,可靠)。
     - -webkit-box **只用于 -webkit-line-clamp**(多行省略,4.2 支持)。
     - 零 CSS 变量、零 ES6;共享样式全在本外壳 head(片段经 innerHTML 注入,不解析片段内 <style>)。
   色调参考「屏幕监测」panel-legacy:暖米灰底 #ece8de、卡片 #f5f1e8、主字 #151515,
   次级字 #555/#666/#888。比纯白省眼、比深黑更适合老 LCD 低亮度常亮。
   ============================================================================ */
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box;max-height:999999px;}
html,body{width:100%;height:100%;background:#ece8de;color:#151515;-webkit-text-size-adjust:none;
  font-family:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif;
  font-size:14px;line-height:1.4;}
body{overflow:hidden;}
.clear:after{content:"";display:block;clear:both;}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* 斜线填充(hatch);-webkit- 前缀,4.2 渲不出回退浅灰 */
.hatch{background:#d2cec5;background-image:-webkit-repeating-linear-gradient(45deg,#151515 0,#151515 2px,#f5f1e8 2px,#f5f1e8 4px);
  background-image:repeating-linear-gradient(45deg,#151515 0,#151515 2px,#f5f1e8 2px,#f5f1e8 4px);}
.hatch-b{background:#d2cec5;background-image:-webkit-repeating-linear-gradient(-45deg,#555 0,#555 1px,#f5f1e8 1px,#f5f1e8 5px);
  background-image:repeating-linear-gradient(-45deg,#555 0,#555 1px,#f5f1e8 1px,#f5f1e8 5px);}

/* ============================ 骨架:绝对定位三段(main 定高)============================ */
.page{position:absolute;left:0;right:0;top:0;bottom:0;}
.mast{position:absolute;left:20px;right:20px;top:14px;height:46px;border-bottom:2.5px solid #151515;overflow:hidden;}
.main{position:absolute;left:20px;right:20px;top:68px;bottom:30px;overflow:hidden;}
.foot{position:absolute;left:20px;right:20px;bottom:8px;height:17px;border-top:1px solid rgba(0,0,0,.15);padding-top:5px;

.foot .rt{float:right;}

/* 报头内容 */
.mast .meta{float:right;text-align:right;font-size:12px;color:#555;font-weight:600;line-height:1.35;padding-top:3px;}
.kicker{font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:2px;}
.title{font-size:24px;font-weight:800;letter-spacing:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 两栏旧辅助:只保留给非承重小结构;首页/AI/打印机走下面的固定坐标布局。 */
.cols{height:100%;}
.cols:after{content:"";display:block;clear:both;}

.abscols{position:relative;height:100%;overflow:hidden;}
.acol{position:absolute;top:0;bottom:0;overflow:hidden;}
.home-l{left:0;width:420px;padding-right:18px;border-right:1px solid rgba(0,0,0,.15);}
.home-r{left:448px;right:0;}

.ai-r{left:292px;right:0;}
.ai-cost{position:absolute;left:0;right:16px;bottom:0;border-top:2px solid #151515;padding-top:10px;}

#content{position:absolute;left:0;right:0;top:0;bottom:24px;overflow:hidden;}

  -webkit-box-shadow:0 2px 8px rgba(0,0,0,.2);box-shadow:0 2px 8px rgba(0,0,0,.2);}
#banner.show{display:block;}

  border-top:1px solid #d2cec5;padding-top:8px;z-index:20;}
#dots b{display:inline-block;width:7px;height:7px;margin:0 4px;background:#d2cec5;
  -webkit-border-radius:5px;border-radius:5px;vertical-align:middle;}

<body>
<div id="banner"></div>
<div id="content"></div>
<div id="prevz"></div>
<div id="nextz"></div>
<div id="dots"></div>

<script>
/* 纯 ES5(无 const/let/箭头/模板串/Promise/fetch):4.2 古董 WebKit 能跑。取数用 XMLHttpRequest。
   外壳只做:XHR 拿片段 → #content.innerHTML → 翻页;失败保留上一帧不白屏。业务 HTML 全在服务端 Jinja。 */
"use strict";
var CFG = __APP_CONFIG__;   /* {token, interval, page_interval, pages:[{key,title}], default, texts:{reconnecting,no_pages}} */
var T = CFG.texts || {};
var tok = CFG.token || "";
var pages = CFG.pages || [];
var cur = CFG.default || (pages[0] && pages[0].key) || "home";

var content = document.getElementById("content");
var banner = document.getElementById("banner");
var dotsBox = document.getElementById("dots");

function withTok(url) {
  if (!tok) return url;
  return url + (url.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(tok);
}
function curIndex() {
  for (var i = 0; i < pages.length; i++) { if (pages[i].key === cur) return i; }
  return 0;
}
function renderDots() {
  if (pages.length <= 1) { dotsBox.style.display = "none"; return; }
  var html = "", idx = curIndex();
  for (var i = 0; i < pages.length; i++) { html += '<b class="' + (i === idx ? "on" : "") + '"></b>'; }
  dotsBox.innerHTML = html;
}

/* —— 重连横幅(失败时显示,保留上一帧内容)—— */
var online = true;
function setOnline(ok) {
  if (ok === online) return;
  online = ok;
  if (ok) { banner.className = ""; }
  else { banner.innerHTML = T.reconnecting || "连接中断,重连中…"; banner.className = "show"; }
}

/* —— 自适应裁剪(news 等):容器标 data-fit,只保留「完整放得下」的条目,放不下的整条隐藏。
   纯 ES5 + offsetHeight,4.2 古董 WebKit 能跑。这样资讯页按内容长短显示 1~N 条、每条都完整、不半截。 */
function trimOverflow() {
  var box = content.querySelector ? content.querySelector("[data-fit]") : null;
  if (!box) return;
  var kids = box.children;
  if (!kids || !kids.length) return;
  var avail = box.clientHeight, used = 0, cutting = false;
  for (var i = 0; i < kids.length; i++) {
    kids[i].style.display = "";                  /* 先复位(轮询复用同一外壳)*/
  }
  for (var j = 0; j < kids.length; j++) {
    var h = kids[j].offsetHeight;
    if (cutting || (used > 0 && used + h > avail)) {
      kids[j].style.display = "none";            /* 第一条放不下起,这条及之后全隐藏 */
      cutting = true;
    } else {
      used += h;
    }
  }
}

/* —— 换页后执行片段内 <script>(innerHTML 不会自动跑;音乐页歌词滚动靠它)。
   纯 ES5;只有带脚本的片段(音乐页)受影响,其余页无 <script> 即空操作。
   脚本自身负责自清理上一轮定时器(window.__mtick),避免轮询累积。 */
function runFragmentScripts() {
  if (!content.getElementsByTagName) return;
  var list = content.getElementsByTagName("script"), arr = [], i;
  for (i = 0; i < list.length; i++) { arr.push(list[i]); }
  for (i = 0; i < arr.length; i++) {
    var o = arr[i], s = document.createElement("script");
    if (o.src) { s.src = o.src; } else { s.text = o.text; }
    o.parentNode.replaceChild(s, o);
  }
}

/* —— 取单页片段(target=legacy 的 HTML)—— */
var loading = false;
function loadPage(key, swap) {
  if (loading) return;
  loading = true;
  var xhr = new XMLHttpRequest();
  xhr.open("GET", withTok("/app-legacy/page/" + key), true);
  if (tok) { xhr.setRequestHeader("X-Access-Token", tok); }
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    loading = false;
    if (xhr.status >= 200 && xhr.status < 300) {
      content.innerHTML = xhr.responseText;   /* 片段用外壳 head 的共享类;轮询只换这里 */
      runFragmentScripts();                    /* innerHTML 不跑 <script>;手动重跑(音乐页歌词滚动靠它)*/
      trimOverflow();                          /* 自适应:news 等只留完整放得下的条目 */
      setOnline(true);
    } else {
      setOnline(false);                        /* 失败:保留上一帧,不清空(诚实降级)*/
    }
  };
  try { xhr.send(); } catch (e) { loading = false; setOnline(false); }
}

/* —— 翻页:自动轮播(page_interval)+ 点两侧热区/指示点手动翻 —— */
var rotateTimer = null;
function scheduleRotate() {
  if (rotateTimer) { clearTimeout(rotateTimer); }
  if (pages.length <= 1) return;
  var ms = Math.max(5, CFG.page_interval || 20) * 1000;
  rotateTimer = setTimeout(function () { nextPage(); }, ms);
}
function gotoPage(key) {
  cur = key;
  renderDots();
  loadPage(cur, true);
  scheduleRotate();
}
function nextPage() { if (pages.length) gotoPage(pages[(curIndex() + 1) % pages.length].key); }
function prevPage() { if (pages.length) gotoPage(pages[(curIndex() - 1 + pages.length) % pages.length].key); }

document.getElementById("nextz").onclick = function () { nextPage(); };
document.getElementById("prevz").onclick = function () { prevPage(); };
dotsBox.onclick = function (e) {
  var b = e.target;
  if (b && b.tagName && b.tagName.toLowerCase() === "b") {
    var bs = dotsBox.getElementsByTagName("b");
    for (var i = 0; i < bs.length; i++) { if (bs[i] === b) { gotoPage(pages[i].key); return; } }
  }
};

/* —— 数据轮询(news 跳过:停留期间不变,每轮到一次才换一批,避免中途跳条)—— */
var NO_POLL = { news: 1 };
function startPolling() {
  var ms = Math.max(3, CFG.interval || 5) * 1000;
  setInterval(function () { if (!NO_POLL[cur]) loadPage(cur, false); }, ms);
}

/* —— 启动 —— */
if (pages.length) {
  renderDots();
  loadPage(cur, true);
  scheduleRotate();
  startPolling();
} else {
  content.innerHTML = '<div class="page"><div class="card" style="margin-top:40px">'
    + (T.no_pages || "还没启用任何页面,请先在设置页配置数据源。") + "</div></div>";
}
</script>
</body>
</html>
